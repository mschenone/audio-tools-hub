---
- name: Vital
  author: Matt Tytel
  type: Synth
  url: https://vital.audio/
  description: Spectral warping wavetable synthesizer.
  os:
  - Windows
  - macOS
  - Linux
  price: free
  detailed_description: Vital is a visually stunning spectral warping wavetable synthesizer.
    It allows you to see how the sound is being created in real-time, offering extremely
    flexible modulation routing, custom wavetables, and high-quality built-in effects.
    A must-have for modern electronic music production.
  description_it: Sintetizzatore wavetable a distorsione spettrale.
  detailed_description_it: Vital è un sintetizzatore wavetable a distorsione spettrale
    visivamente sbalorditivo. Ti permette di vedere come il suono viene creato in
    tempo reale, offrendo un routing di modulazione estremamente flessibile, wavetable
    personalizzate ed effetti integrati di alta qualità. Un must per la produzione
    di musica elettronica moderna.
- name: Valhalla Supermassive
