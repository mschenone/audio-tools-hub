name: Renovate

on:
  schedule:
    # Runs at 04:00 UTC every Monday. You can adjust this cron schedule.
    - cron: '0 4 * * 1'
  # Allows you to trigger the workflow manually from the GitHub Actions UI
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    # These permissions are required for the GITHUB_TOKEN to create branches and PRs
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.1.11
        with:
          # Uses the renovate.json we created earlier
          configurationFile: renovate.json
          # Falls back to GITHUB_TOKEN if a custom RENOVATE_TOKEN is not provided
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: 'info'
          # Tells Renovate to only run on this specific repository
          RENOVATE_REPOSITORIES: ${{ github.repository }}
