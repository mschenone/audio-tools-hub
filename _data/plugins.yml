- name: OTT
  author: Xfer Records
  type: Effects
  url: https://xferrecords.com/freeware
  description: Multiband upwards/downwards compressor.
  os:
  - Windows
  - macOS
  price: free
  detailed_description: OTT is a re-creation of a popular aggressive multiband upwards/downwards
    compressor setting used by many electronic music producers. It squashes dynamics
    to bring out the subtle details, creating a highly compressed, 'in-your-face'
    sound.
  description_it: Compressore multibanda upwards/downwards.
  detailed_description_it: OTT è la ricreazione di una popolare impostazione di compressore
    multibanda upwards/downwards aggressivo utilizzata da molti produttori di musica
